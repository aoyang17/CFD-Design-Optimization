[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-design-optimization"
version = "0.1.0"
description = "Unified workflows for multifidelity and operation-aware CFD design optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
data = ["pandas>=2.0", "scikit-learn>=1.3"]
surrogate = ["tensorflow>=2.12"]
dev = ["pytest>=8"]

[project.scripts]
cfd-do-assets = "cfd_design_opt.assets:main"

[tool.setuptools.packages.find]
where = ["src"]
